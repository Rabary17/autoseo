name: Rapport quotidien monauto

# Aucun appel à l'API Claude/Mistral ici — juste des lectures WordPress
# (source de vérité) puis un envoi d'e-mail combiné (une section par niche
# active). Coût quasi nul, peut tourner tous les jours sans conflit avec
# l'économie de tokens du pipeline de génération (autopublish.yml).
#
# Cron réactivé le 2026-09-08 : la raison de désactivation du 2026-08-05
# (calendrier du projet en avance sur l'horloge réelle des runners) ne tient
# plus, la date réelle a rejoint le calendrier du pipeline (voir
# autopublish.yml pour le même changement et son raisonnement détaillé).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC, tous les jours

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Générer le rapport combiné (une niche par sous-process)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: npm run daily-report:all

      - name: Envoyer l'e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "monauto — rapport quotidien"
          to: techcars.fr@gmail.com
          from: monauto autopublish <${{ secrets.GMAIL_USER }}>
          html_body: file://logs/autopublish/daily-report-latest.html
