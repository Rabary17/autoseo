name: Test end-to-end monauto

# Déclenchement manuel uniquement — vérifie la chaîne complète (génération
# Claude, relecture, image, écriture WordPress, rapport quotidien, envoi
# e-mail) sur UN SEUL article de test, sans toucher aux données réelles du
# pipeline (data/autopublish-state.json, tracking-mots-cles.xlsx). À lancer
# une fois après avoir configuré tous les secrets, avant d'activer le
# calendrier hebdomadaire réel.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Diagnostic auth WordPress (même client Node que le pipeline, aucune valeur secrète affichée)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          cat > /tmp/wp-auth-check.js <<'EOF'
          const origin = (process.env.WP_URL || '').replace(/\/$/, '');
          const url = `${origin}/?rest_route=/wp/v2/users/me`;
          const auth = 'Basic ' + Buffer.from(`${process.env.WP_USER}:${process.env.WP_APP_PASSWORD}`).toString('base64');
          const u = process.env.WP_USER || '';
          const p = process.env.WP_APP_PASSWORD || '';
          console.log('--- Forme des identifiants (aucune valeur brute, non masquable) ---');
          console.log('WP_URL commence par https:// ?', origin.startsWith('https://'), '| longueur URL :', origin.length);
          console.log('WP_USER -> longueur :', u.length, '| contient @ :', u.includes('@'), '| 1er caractère :', JSON.stringify(u[0] || ''), '| espaces en trop :', u !== u.trim());
          console.log('WP_APP_PASSWORD -> longueur :', p.length, '| nb espaces :', (p.match(/ /g) || []).length);
          console.log('   (attendu : WP_USER longueur ~31 avec @ ; sinon c\'est « Andrianina » = mauvais identifiant)');
          console.log('URL testée (schéma + hôte uniquement) :', url.split('?')[0]);
          fetch(url, { headers: { Authorization: auth, 'content-type': 'application/json' } })
            .then(async (res) => {
              const text = await res.text();
              console.log('Code HTTP (Node fetch, même client que wp-client.js) :', res.status);
              try {
                const j = JSON.parse(text);
                console.log('id utilisateur authentifié :', j.id, '- slug :', j.slug, '- roles :', JSON.stringify(j.roles));
              } catch (e) {
                console.log('Réponse non-JSON, premiers 300 caractères :', text.slice(0, 300));
              }
            })
            .catch((e) => console.log('Erreur réseau :', e.message));
          EOF
          node /tmp/wp-auth-check.js

      - name: Test end-to-end (génération, relecture, image, écriture WP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          RI_PEXELS_KEY: ${{ secrets.RI_PEXELS_KEY }}
          RI_UNSPLASH_KEY: ${{ secrets.RI_UNSPLASH_KEY }}
          RI_PIXABAY_KEY: ${{ secrets.RI_PIXABAY_KEY }}
        run: npm run test:e2e

      - name: Générer le rapport quotidien (doit inclure l'article de test)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: npm run daily-report

      - name: Envoyer l'e-mail de test
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[TEST] monauto — test end-to-end"
          to: andrianina.rabarivelo@gmail.com
          from: monauto autopublish <${{ secrets.GMAIL_USER }}>
          html_body: file://logs/autopublish/daily-report-latest.html

      - name: Publier le log de test en résumé de run
        if: always()
        run: |
          if [ -f "logs/autopublish/test-e2e-latest.md" ]; then
            cat "logs/autopublish/test-e2e-latest.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Committer le log de test
        if: always()
        run: |
          git config user.name "autopublish-bot"
          git config user.email "autopublish-bot@users.noreply.github.com"
          git add logs/autopublish/test-e2e-latest.md data/autopublish-image-ledger.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "test-e2e: run $(date -u +%Y-%m-%dT%H-%M)"
            # main a pu avancer entre le checkout et ce commit (push concurrent
            # depuis un autre poste/session) — rebase sur la dernière version
            # avant de pousser plutôt que d'échouer sèchement en non-fast-forward.
            git fetch origin main
            git rebase origin/main
            git push
          fi
