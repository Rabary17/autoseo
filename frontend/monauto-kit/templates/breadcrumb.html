<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partial — Breadcrumb</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/monauto.css">
</head>
<body>
<!-- ▼▼ PARTIAL: header / app bar ▼▼ -->
<header class="appbar">
  <a class="appbar__logo" href="/" aria-label="monauto — accueil">
    <img class="appbar__mark" src="../assets/mark.svg" alt="">
    <span class="appbar__word">monauto<span class="dot">.</span></span>
  </a>
  <!-- {{ liens de navigation — visibles sur desktop uniquement }} -->
  <nav class="appbar__nav" aria-label="Rubriques">
    <a class="chip" href="/categorie/entretien">Entretien</a>
    <a class="chip" href="/categorie/pannes-diagnostic">Pannes</a>
    <a class="chip" href="/categorie/essais-comparatifs">Essais</a>
    <a class="chip" href="/categorie/electrique-hybride">Électrique</a>
    <a class="chip" href="/rubriques">Toutes les rubriques</a>
  </nav>
  <div class="appbar__actions">
    <button class="icon-btn" aria-label="Rechercher">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn" aria-label="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
<!-- ▲▲ PARTIAL: header ▲▲ -->
<main class="wrap"><!-- ▼▼ PARTIAL: breadcrumb ▼▼ -->
<nav class="breadcrumb" aria-label="Fil d'Ariane">
  <ol>
    <li><a href="/">Accueil</a></li>
    <li><a href="/categorie/essais">Essais</a></li>
    <li><span aria-current="page">{{ post.title }}</span></li>
  </ol>
</nav>
<!-- ▲▲ PARTIAL: breadcrumb ▲▲ --></main>
</body>
</html>
